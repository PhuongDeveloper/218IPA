workflows:
  ios-unsigned-ipa:
    name: iOS unsigned IPA
    max_build_duration: 120
    instance_type: mac_mini_m2
    environment:
      xcode: latest
    scripts:
      - name: Fetch Git LFS assets
        script: git lfs pull

      - name: Build iOS app without code signing
        script: |
          set -euo pipefail
          xcodebuild build \
            -project "$CM_BUILD_DIR/Unity-iPhone.xcodeproj" \
            -scheme "Unity-iPhone" \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            DEVELOPMENT_TEAM=""

      - name: Package unsigned IPA
        script: |
          set -euo pipefail
          APP_PATH=$(find "$HOME/Library/Developer/Xcode/DerivedData" \
            -path '*/Build/Products/Release-iphoneos/*.app' \
            -type d \
            -not -path '*/UnityFramework.framework/*' \
            | head -n 1)

          if [ -z "$APP_PATH" ]; then
            echo "Could not find the built iOS app."
            exit 1
          fi

          mkdir -p "$CM_BUILD_DIR/build/Payload"
          cp -R "$APP_PATH" "$CM_BUILD_DIR/build/Payload/"
          (
            cd "$CM_BUILD_DIR/build"
            zip -qry "Unity-iPhone-unsigned.ipa" Payload
          )
    artifacts:
      - build/*.ipa
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.app
      - /tmp/xcodebuild_logs/*.log
